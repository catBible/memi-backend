spring.application.name=life-os-backend
# Listen on all network interfaces (LAN, Docker, cloud). Port from env on many hosts (e.g. Railway, Render)
server.address=0.0.0.0
server.port=${PORT:8080}
# Correct scheme/host when behind reverse proxy
server.forward-headers-strategy=framework
# Optional extra CORS origin patterns, comma-separated (env CORS_EXTRA_PATTERNS or app.cors)
# Built-in: localhost, 127.0.0.1, *.vercel.app
app.cors.extra-patterns=${CORS_EXTRA_PATTERNS:}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Production / Railway: set environment variable API_KEY. Used by ApiKeyFilter for write operations.
app.api.key=${API_KEY:}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Loaded last: can override app.api.* for local file-based dev
spring.config.import=optional:classpath:local.properties
